[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "solar_forecast"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "pvlib>=0.10",
    "lightgbm>=4.0",
    "pandas>=2.0",
    "numpy>=1.26",
    "openmeteo-requests>=1.0",
    "requests-cache>=1.0",
    "retry-requests>=2.0",
    "properscoring>=0.1",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "jupyter>=1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["solar_forecast*"]
