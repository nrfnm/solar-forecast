[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "solar_forecast"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    # Physics / forecasting
    "pvlib>=0.10",
    "lightgbm>=4.0",
    "properscoring>=0.1",
    "scipy>=1.10",
    # Data wrangling
    "pandas>=2.0",
    "numpy>=1.26",
    "scikit-learn>=1.3",       # KMeans in capacity.py
    "pyarrow>=14.0",           # parquet I/O in pipeline.py
    # API clients
    "openmeteo-requests>=1.0", # Open-Meteo NWP + ERA5
    "requests>=2.31",          # ENTSO-E REST API
    "requests-cache>=1.0",
    "retry-requests>=2.0",
    # MaStR
    "open-mastr>=0.12",
    "sqlalchemy>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "jupyter>=1.0",
    "matplotlib>=3.7",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["solar_forecast*"]
